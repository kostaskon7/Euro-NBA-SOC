<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Strength of schedule for EuroLeague and NBA teams: how hard is each team's upcoming run of games?">
  <title>Strength of Schedule</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">SOS</span>
      <span class="brand-text">Strength of Schedule</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="League">
      <button class="tab" role="tab" id="tab-euroleague" data-league="euroleague" aria-controls="content" aria-selected="true" type="button">EuroLeague</button>
      <button class="tab" role="tab" id="tab-nba" data-league="nba" aria-controls="content" aria-selected="false" tabindex="-1" type="button">NBA</button>
    </nav>
  </header>

  <main class="page">
    <section class="hero">
      <h1 id="league-title">EuroLeague Strength of Schedule</h1>
      <p class="lede">Average win % of each team's next opponents. Higher means a tougher stretch. Tap a team to see its games.</p>
      <p id="league-meta" class="meta"></p>
      <p id="notice" class="notice" role="status" hidden></p>
    </section>

    <section id="controls" class="controls" aria-label="Options" hidden>
      <div class="games-control">
        <label for="games-range" class="control-label">Next <strong id="games-count">10</strong> games</label>
        <div class="stepper">
          <button id="games-dec" class="step" type="button" aria-label="Fewer games">&minus;</button>
          <input id="games-range" class="range" type="range" min="1" max="10" value="10">
          <button id="games-inc" class="step" type="button" aria-label="More games">+</button>
        </div>
      </div>
      <div class="filters">
        <label class="field">
          <span class="visually-hidden">Search teams</span>
          <input id="search" type="search" placeholder="Search team" autocomplete="off" enterkeyhint="search">
        </label>
        <label class="field">
          <span class="visually-hidden">Sort by</span>
          <select id="sort">
            <option value="hard">Hardest first</option>
            <option value="easy">Easiest first</option>
            <option value="standing">Standings</option>
            <option value="name">Name</option>
          </select>
        </label>
      </div>
    </section>

    <section id="content" class="content" role="tabpanel" aria-labelledby="tab-euroleague" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p>Data: EuroLeague API &amp; ESPN. Win % uses current-season records.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
